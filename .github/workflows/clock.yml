name: GongXueYun Auto CheckIn & Report

on:
  workflow_dispatch:
    inputs:
      sign_type:
        description: "打卡类型: START(上班) 或 END(下班)"
        required: false
        default: ""
      force_checkin:
        description: "是否强制触发(测试验证码): true/false"
        required: false
        default: "false"
  schedule:
    # 每天早晨 09:30 (UTC 01:30) 与 下午 17:30 (UTC 09:30) 运行
    - cron: "30 1,9 * * *"

permissions:
  contents: write
  issues: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_TYPE: ${{ inputs.sign_type }}
          FORCE_CHECKIN: ${{ inputs.force_checkin }}
          PHONE: ${{ secrets.PHONE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROVINCE: ${{ secrets.PROVINCE }}
          CITY: ${{ secrets.CITY }}
          AREA: ${{ secrets.AREA }}
          ADDRESS: ${{ secrets.ADDRESS }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          LATITUDE: ${{ secrets.LATITUDE }}
          DESCRIPTION: ${{ secrets.DESCRIPTION }}
          OUT_REGISTER_NO: ${{ secrets.OUT_REGISTER_NO }}
          SECRET: ${{ secrets.SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || secrets.SECRET }}
          SENDKEY: ${{ secrets.SENDKEY || secrets.SECRET }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
        run: python gongxueyun_auto.py --mode auto
