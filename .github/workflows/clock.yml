name: GongXueYun Auto CheckIn & Report

on:
  workflow_dispatch:
    inputs:
      sign_type:
        description: '打卡类型 (START=上班, END=下班)'
        required: true
        default: 'END'
        type: choice
        options:
          - END
          - START
  schedule:
    - cron: "30 0,9 * * 1-6"

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checkin script
        env:
          PHONE: ${{ secrets.PHONE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROVINCE: ${{ secrets.PROVINCE }}
          CITY: ${{ secrets.CITY }}
          AREA: ${{ secrets.AREA }}
          ADDRESS: ${{ secrets.ADDRESS }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          LATITUDE: ${{ secrets.LATITUDE }}
          DESCRIPTION: ${{ secrets.DESCRIPTION }}
          OUT_REGISTER_NO: ${{ secrets.OUT_REGISTER_NO }}
          SIGN_TYPE: ${{ inputs.sign_type || 'END' }}
        run: python gongxueyun_auto.py
