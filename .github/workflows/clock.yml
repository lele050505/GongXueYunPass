name: GongXueYun Checkin

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '30 9 * * 1-5'

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run checkin script
      env:
        USER: ${{ secrets.USER }}
        PHONE: ${{ secrets.PHONE }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PROVINCE: ${{ secrets.PROVINCE }}
        CITY: ${{ secrets.CITY }}
        AREA: ${{ secrets.AREA }}
        ADDRESS: ${{ secrets.ADDRESS }}
        LONGITUDE: ${{ secrets.LONGITUDE }}
        LATITUDE: ${{ secrets.LATITUDE }}
        DEVICE: ${{ secrets.DEVICE }}
        DESCRIPTION: ${{ secrets.DESCRIPTION }}
        SENDKEY: ${{ secrets.SENDKEY }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        OUT_REGISTER_NO: ${{ secrets.OUT_REGISTER_NO }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
       PROXY_URL: ${{ secrets.PROXY_URL }}
       PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
      run: |
        python gongxueyun_auto.py --mode auto
