<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>工学云打卡 - 支付宝安全验证</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      margin-top: 20px;
    }
    .icon {
      width: 64px;
      height: 64px;
      line-height: 64px;
      background: #e6f7ff;
      border-radius: 50%;
      margin: 0 auto 16px;
      font-size: 32px;
    }
    h2 { font-size: 20px; font-weight: 600; color: #1f1f1f; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #8c8c8c; margin-bottom: 24px; line-height: 1.5; }
    .btn-alipay {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 28px;
      box-shadow: 0 6px 16px rgba(22, 119, 255, 0.35);
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }
    .btn-alipay:active { opacity: 0.9; transform: scale(0.98); }
    .guide-box {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 10px;
      padding: 14px;
      margin-top: 24px;
      text-align: left;
      font-size: 13px;
      color: #ad6800;
      line-height: 1.6;
    }
    .guide-box strong { color: #d46b08; }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #bfbfbf;
    }
    .weixin-tip {
      display: none;
      position: fixed;
      left: 0; top: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 9999;
    }
    .weixin-tip img {
      position: absolute;
      right: 24px;
      top: 16px;
      width: 260px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <h2>工学云打卡安全核验</h2>
    <p class="desc">云端打卡已触发，正在为您唤起手机支付宝进行人脸实名核验</p>

    <a id="jumpBtn" href="javascript:void(0);" onclick="jumpToAlipay();" class="btn-alipay">
      👉 立即打开支付宝完成核验
    </a>

    <div class="guide-box">
      <strong>📌 若在微信内点击无反应：</strong><br>
      请点击右上角 <b>【···】</b> ➔ 选择 <b>【在浏览器打开】</b> 或 <b>【在默认浏览器中打开】</b>，即可秒进支付宝！
    </div>

    <div class="footer">
      核验完成后云端将在几秒内自动打卡，无需其他操作
    </div>
  </div>

  <script>
    function getTargetUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      let target = urlParams.get('url');
      if (!target && window.location.hash) {
        target = decodeURIComponent(window.location.hash.substring(1));
      }
      return target || '';
    }

    function isWeixin() {
      const ua = navigator.userAgent.toLowerCase();
      return ua.indexOf('micromessenger') !== -1;
    }

    function jumpToAlipay() {
      const target = getTargetUrl();
      if (!target) {
        alert('未获取到有效的核验链接，请检查参数');
        return;
      }
      // 如果目标是 alipays://，先尝试 ds.alipay.com 官方网关
      if (target.startsWith('alipays://')) {
        const dsUrl = 'https://ds.alipay.com/?scheme=' + encodeURIComponent(target);
        window.location.href = dsUrl;
        setTimeout(() => {
          window.location.href = target;
        }, 800);
      } else {
        window.location.href = target;
      }
    }

    // 页面加载完成后自动尝试拉起
    window.onload = function() {
      const target = getTargetUrl();
      if (target) {
        // 自动尝试跳转一次
        setTimeout(jumpToAlipay, 300);
      }
    };
  </script>
</body>
</html>
